name: mypy

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mypy.yml"
      - "kuznets/**"
      - "pyproject.toml"
      - "pixi.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for hatch-vcs
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.70.2
          environments: default
          cache: true

      # kuznets ships py.typed, so its annotations are part of the public contract.
      - name: Run mypy
        run: pixi run -e default typecheck
